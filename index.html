<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>लेन-देन | MASTER REGISTRY</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #020617; font-family: sans-serif; color: #f8fafc; }
    .tab-active { border-bottom: 2px solid #f59e0b; color: #f59e0b; font-weight: bold; }
  </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col justify-between">

  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="font-extrabold text-white text-lg">LEN-DEN <span class="text-amber-400">SCORE</span></h1>
      <div id="userBadge" class="hidden flex items-center gap-3">
        <span id="shopkeeperDisplayCode" class="font-mono font-bold text-amber-300 text-xs bg-slate-800 px-3 py-1 rounded-full"></span>
        <button onclick="logout()" class="bg-red-950 border border-red-800 text-red-300 font-bold px-3 py-1 rounded text-xs">लॉगआउट</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 flex-1 w-full">
    <!-- LOGIN VIEW -->
    <div id="authView" class="max-w-md mx-auto mt-16 bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">
      <h2 class="text-xl font-bold text-white mb-2">Len-Den Registry</h2>
      <p class="text-xs text-slate-400 mb-6">लॉगिन करने के लिए नीचे दिए गए बटन पर क्लिक करें</p>
      <button onclick="signInWithGoogle()" class="w-full bg-white text-slate-950 font-bold py-3 rounded-xl text-sm shadow cursor-pointer">
        Google (Gmail) से लॉगिन करें
      </button>
      <div id="authStatusMsg" class="mt-4 text-xs font-bold text-amber-400 hidden"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="shopkeeperDashboard" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
        <h3 id="dashShopTitle" class="text-sm font-bold text-slate-200">दुकानदार डैशबोर्ड</h3>
      </div>
      
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <h2 class="text-xs font-bold text-slate-300 mb-2">नया लेन-देन जोड़ें</h2>
        <form onsubmit="handleAddTransaction(event)" class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
          <input type="text" id="txCustName" placeholder="ग्राहक का नाम *" required class="bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white outline-none" />
          <input type="tel" id="txCustPhone" placeholder="मोबाइल नंबर (10 अंक) *" required maxlength="10" class="bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white font-mono outline-none" />
          <input type="number" id="txAmount" placeholder="रकम (₹) *" required class="bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-amber-400 font-bold font-mono outline-none" />
          <button type="submit" class="md:col-span-3 bg-amber-500 font-bold text-slate-950 py-2.5 rounded-xl cursor-pointer">+ उधारी दर्ज करें</button>
        </form>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <h2 class="text-xs font-bold text-slate-300 mb-2">आपकी दुकान का हिसाब</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="text-slate-400 uppercase border-b border-slate-800">
              <tr>
                <th class="py-2">ग्राहक</th><th>मोबाइल</th><th>रकम</th><th>स्थिति</th><th>एक्शन</th>
              </tr>
            </thead>
            <tbody id="shopkeeperTxList" class="divide-y divide-slate-800 font-medium"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <h2 class="text-sm font-bold text-amber-400 mb-2">सुपर एडमिन कंट्रोल पैनल</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="text-slate-400 uppercase border-b border-slate-800">
              <tr>
                <th class="py-2">ID</th><th>दुकान / मालिक</th><th>ईमेल</th><th>शहर</th><th>स्थिति</th>
              </tr>
            </thead>
            <tbody id="adminShopkeepersList" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-slate-900 border-t border-slate-800 p-3 text-center text-xs text-slate-400">
    <span>LEN-DEN Registry • Supabase Active</span>
  </footer>

  <script>
    const MASTER_ADMIN_EMAIL = "admin@gmail.com";
    const SUPABASE_URL = "https://sjxckncjxxqoymjtydpz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o534-o_bYy_aRRjXh0W0fA_WcK9Drem";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    async function signInWithGoogle() {
      const msg = document.getElementById('authStatusMsg');
      if (msg) {
        msg.classList.remove('hidden');
        msg.innerText = "Google से कनेक्ट हो रहा है...";
      }
      const { error } = await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
      if (error && msg) msg.innerText = "❌ लॉगिन फेल: " + error.message;
    }

    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (session && event === 'SIGNED_IN') {
        const email = session.user.email;
        const name = session.user.user_metadata.full_name || "Owner";

        if (email === MASTER_ADMIN_EMAIL) {
          currentUser = { shop_id: "JBSMK000001", name: "Master Admin", role: "admin" };
          initUI();
          return;
        }

        let { data: shop } = await supabaseClient.from('shopkeepers').select('*').eq('email', email).single();

        if (!shop) {
          const autoCode = "SRSAM" + Math.floor(1000 + Math.random() * 9000);
          await supabaseClient.from('shopkeepers').insert([{
            shop_id: autoCode,
            name: 'New Shop',
            shop_name: 'New Shop',
            owner_name: name,
            email: email,
            city: "SAMALKHA",
            phone: "9876543210",
            pin: "0000",
            status: "pending"
          }]);
          alert("✅ अकाउंट रजिस्टर हो गया है! एडमिन द्वारा अप्रूवल मिलने के बाद लॉगिन करें।");
          await supabaseClient.auth.signOut();
          window.location.reload();
        } else if (shop.status === 'pending') {
          alert("⏳ आपकी ID अभी पेंडिंग है।");
          await supabaseClient.auth.signOut();
        } else if (shop.status === 'blocked') {
          alert("🚫 अकाउंट ब्लॉक है।");
          await supabaseClient.auth.signOut();
        } else {
          currentUser = shop;
          initUI();
        }
      } else if (event === 'SIGNED_OUT') {
        currentUser = null;
        location.reload();
      }
    });

    async function logout() {
      await supabaseClient.auth.signOut();
    }

    function initUI() {
      const authView = document.getElementById('authView');
      const userBadge = document.getElementById('userBadge');
      if (authView) authView.classList.add('hidden');
      if (userBadge) userBadge.classList.remove('hidden');
      
      const codeSpan = document.getElementById('shopkeeperDisplayCode');
      if (codeSpan) codeSpan.innerText = currentUser.shop_id;

      if (currentUser.role === 'admin' || currentUser.shop_id === 'JBSMK000001') {
        const adminDash = document.getElementById('adminDashboard');
        if (adminDash) adminDash.classList.remove('hidden');
        loadAdminData();
      } else {
        const shopDash = document.getElementById('shopkeeperDashboard');
        const title = document.getElementById('dashShopTitle');
        if (shopDash) shopDash.classList.remove('hidden');
        if (title) title.innerText = currentUser.shop_name || currentUser.name || "दुकानदार डैशबोर्ड";
        loadShopkeeperData();
      }
      lucide.createIcons();
    }

    async function loadShopkeeperData() {
      if (!currentUser) return;
      const { data: txs } = await supabaseClient.from('transactions').select('*').eq('shop_id', currentUser.shop_id).order('created_at', { ascending: false });
      const list = document.getElementById('shopkeeperTxList');
      if (list) {
        list.innerHTML = (txs || []).map(t => `
          <tr>
            <td class="py-2 font-bold text-white">${t.customer_name}</td>
            <td class="font-mono">${t.customer_phone}</td>
            <td class="text-amber-400 font-mono">₹${t.amount}</td>
            <td><span class="text-[10px] bg-red-500/20 text-red-400 px-2 py-0.5 rounded font-bold">${t.status}</span></td>
            <td>${t.status !== 'cleared' ? `<button onclick="clearTx('${t.id}')" class="bg-emerald-600 text-white px-2 py-1 rounded text-xs">क्लियर</button>` : 'चुकता'}</td>
          </tr>
        `).join('') || `<tr><td colspan="5" class="text-center py-4 text-slate-500">कोई डेटा नहीं</td></tr>`;
      }
    }

    async function handleAddTransaction(e) {
      e.preventDefault();
      const phone = document.getElementById('txCustPhone').value.trim();
      if (!/^\d{10}$/.test(phone) \vert{}\vert{} /^(\d)\1{9}$/.test(phone)) {
        alert("❌ कृपया सही 10-अंकों का मोबाइल नंबर दर्ज करें!");
        return;
      }

      const { error } = await supabaseClient.from('transactions').insert([{
        shop_id: currentUser.shop_id,
        customer_name: document.getElementById('txCustName').value.trim(),
        customer_phone: phone,
        amount: parseFloat(document.getElementById('txAmount').value),
        status: "pending"
      }]);

      if (!error) {
        alert("✓ लेन-देन दर्ज हो गया!");
        e.target.reset();
        loadShopkeeperData();
      } else {
        alert("एरर: " + error.message);
      }
    }

    async function clearTx(id) {
      if (!confirm("क्लियर करना चाहते हैं?")) return;
      await supabaseClient.from('transactions').update({ status: 'cleared' }).eq('id', id);
      loadShopkeeperData();
    }

    async function loadAdminData() {
      const { data: shops } = await supabaseClient.from('shopkeepers').select('*').neq('shop_id', 'JBSMK000001');
      const list = document.getElementById('adminShopkeepersList');
      if (list) {
        list.innerHTML = (shops || []).map(s => `
          <tr>
            <td class="py-2 font-mono text-amber-300 font-bold">${s.shop_id}</td>
            <td><b>${s.shop_name || s.name || '-'}</b><br><span class="text-[10px] text-slate-400">${s.owner_name}</span></td>
            <td class="text-slate-400">${s.email}</td>
            <td class="font-mono">${s.city}</td>
            <td><span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-bold">${s.status}</span></td>
          </tr>
        `).join('') || `<tr><td colspan="5" class="text-center py-4 text-slate-500">कोई दुकान नहीं</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
  </script>
</body>
</html>
